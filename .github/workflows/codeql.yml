name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "37 8 * * 1"
  workflow_dispatch:

# Minimal permissions: read the checkout, write scan results. The advanced-setup
# action requires security-events: write; nothing else is granted.
permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Emergency bypass to disable CodeQL if infrastructure issues block releases.
    # To use, set repository variable VENICE_FORGE_DISABLE_CODEQL="true".
    if: vars.VENICE_FORGE_DISABLE_CODEQL != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # JavaScript/TypeScript application analysis (security-extended and
          # security-and-quality are both supported for this language).
          - language: javascript-typescript
            build-mode: none
          # GitHub Actions workflow analysis: security checks such as
          # actions/unpinned-tag (immutable Action pinning). Both suites are
          # supported for the actions language (actions-security-extended.qls /
          # actions-security-and-quality.qls in the CodeQL actions pack).
          - language: actions
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL (${{ matrix.language }})
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis (${{ matrix.language }})
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          # Deterministic per-language category so the two analyses cannot
          # overwrite or masquerade as each other in Code Scanning.
          category: "/language:${{ matrix.language }}"